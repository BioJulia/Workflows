# This repository's own caller of the reusable register.yml, which other repositories call as BioJulia/Workflows/.github/workflows/register.yml@v1; the Self- files apply this repository's workflows to itself.
# Once a release merges into master, it comments for Registrator, which registers ReleaseFlow from its subdirectory; TagBot then tags the release.
name: "Self: Register"

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

jobs:
  register:
    uses: ./.github/workflows/register.yml
    # The comment, as github-actions[bot], needs contents: write.
    permissions:
      contents: write
    with:
      # The action from this commit: a release may be the first with a check that it calls, and its own tag only exists once it's registered.
      local-action: true
      project: ReleaseFlow
