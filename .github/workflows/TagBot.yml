# TagBot: tags each release of ReleaseFlow, registered in General from the subdirectory ReleaseFlow/, vX.Y.Z, the version of the workflows too, with its GitHub release, once General registers it.
# Self-Tag.yml then moves v1 to the newest of them.
name: TagBot

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: write

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    # The ReleaseFlow app's secrets, which the ruleset on `v*` tags lets through; the environment allows the default branch, where this runs.
    environment: releaseflow
    steps:
      # Secrets can't be tested in a step's condition, so this step tells whether a GitHub App is given.
      - id: app-given
        env:
          CLIENT_ID: ${{ secrets.RELEASEFLOW_APP_CLIENT_ID }}
        run: echo "given=$([ -n "$CLIENT_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: app
        if: steps.app-given.outputs.given == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASEFLOW_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASEFLOW_APP_PRIVATE_KEY }}
      - uses: JuliaRegistries/TagBot@ffef3282bcacf1055e4d621a5c010959dfbe59ff # v1.25.13
        with:
          # The app's token, whose tags also start Self-Tag.yml by their push; GITHUB_TOKEN otherwise, whose tags Self-Tag.yml follows when TagBot's run completes.
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          subdir: ReleaseFlow
          # vX.Y.Z, at which the workflows call the action, rather than ReleaseFlow-vX.Y.Z, as for a package in a subdirectory.
          tag_prefix: NO_PREFIX
