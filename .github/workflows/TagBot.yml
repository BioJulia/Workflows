# TagBot: tags the releases of ReleaseFlow that General registers, from the subdirectory ReleaseFlow/, as ReleaseFlow-vX.Y.Z.
# The workflows' own releases, vX.Y.Z, are tagged by hand; see the README.
name: TagBot

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: write

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          subdir: ReleaseFlow
