# This repository's own caller of the reusable gitflow.yml, as other repositories call it; the Self- files apply this repository's workflows to itself.
# This repository follows gitflow, with master and develop, and checks its own pull requests with its released gitflow workflow.
# Its version and changelog are ReleaseFlow's, in ReleaseFlow/.
# It calls the workflow at the major tag, not the pull request's own, whose calls of the action a release sets to its tag before the tag exists; so a pull request is checked by the released checks, and CI tests the pull request's own.
name: "Self: Gitflow"

on:
  pull_request:
    branches:
      - master
      - develop
    # Adding or removing the `skip changelog` label runs the checks again.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# A pull request's new push, or a change of its labels, cancels the run that's still checking it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  gitflow:
    uses: BioJulia/Workflows/.github/workflows/gitflow.yml@v1
    permissions:
      contents: read
    with:
      main-branch: master
      project: ReleaseFlow
