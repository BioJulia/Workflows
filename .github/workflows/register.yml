# Register: once a release merges into the main branch, comment `@JuliaRegistrator register` on its commit, with its section of the changelog as the release notes, so that the registry registers it; TagBot then tags it.
# Called from the repository's own workflow, under gitflow and trunk on pushes to the main branch, and under OneFlow by hand on the release branch, which OneFlow registers before merging it back:
#
#   on:
#     push:
#       branches: [main]
#   jobs:
#     register:
#       uses: BioJulia/Workflows/.github/workflows/register.yml@v1
#       permissions:
#         contents: read
#       secrets:
#         REGISTRATOR_TOKEN: ${{ secrets.REGISTRATOR_TOKEN }}
#
# A commit whose version the registry already records, or that changes no version, has nothing to register, so the workflow does nothing.
# Registrator only acts on comments from accounts with write access to the repository, which an app's bot isn't, so the comment takes REGISTRATOR_TOKEN, a fine-grained personal access token of a machine user with write access.
# A package's first release is registered by hand, which the workflow's warning says how to do.
# TagBot tags the release once the registry merges it.
# The job runs in the deployment environment `environment`, `releaseflow` unless given, which keeps the secret.
name: "Reusable: Register"

on:
  workflow_call:
    inputs:
      project:
        description: The package's directory, relative to the repository's root, for a package in a subdirectory, which the comment names as `subdir`.
        type: string
        default: ''
      registry:
        description: The registry of the package's releases.
        type: string
        default: General
      environment:
        description: The deployment environment that holds the secrets.
        type: string
        default: releaseflow
    secrets:
      REGISTRATOR_TOKEN:
        description: A personal access token of a machine user with write access, whose comment Registrator acts on.
        required: false

permissions: {}

jobs:
  register:
    name: Register
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: registration
        uses: BioJulia/Workflows@v1.0.1
        with:
          check: registration
          project: ${{ inputs.project }}
          registry: ${{ inputs.registry }}
      - name: Comment for Registrator
        if: steps.registration.outputs.register == 'true'
        env:
          GH_TOKEN: ${{ secrets.REGISTRATOR_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RELEASEFLOW_PROJECT: ${{ inputs.project }}
          VERSION: ${{ steps.registration.outputs.version }}
          NOTES: ${{ steps.registration.outputs.notes }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=Register::Registering $VERSION needs REGISTRATOR_TOKEN, a machine user's token, since Registrator only acts on comments from accounts with write access."
            exit 1
          fi
          command="@JuliaRegistrator register${RELEASEFLOW_PROJECT:+ subdir=${RELEASEFLOW_PROJECT%/}}"
          body="$command"
          if [ -n "$NOTES" ]; then
            body="$body

          Release notes:

          $NOTES"
          fi
          gh api "repos/$REPOSITORY/commits/$SHA/comments" -f body="$body" --jq .html_url
          echo "Commented \`$command\` on $SHA, for $VERSION."
